
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競馬予想アプリ</title>
<style>
  body {
    font-family: sans-serif;
    background: #f3f5f7;
    margin: 0;
    padding: 16px;
    color: #222;
  }
  .container {
    max-width: 700px;
    margin: auto;
  }
  h1 { text-align: center; }
  .card {
    background: white;
    padding: 16px;
    border-radius: 12px;
    margin: 12px 0;
    box-shadow: 0 2px 8px #0001;
  }
  label {
    display: block;
    margin-top: 10px;
    font-weight: bold;
  }
  input, select, button {
    box-sizing: border-box;
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
  }
  button {
    background: #146c43;
    color: white;
    border: none;
    font-weight: bold;
    margin-top: 14px;
  }
  button.secondary { background: #555; }
  .horse {
    border: 1px solid #ddd;
    padding: 10px;
    margin-top: 8px;
    border-radius: 8px;
  }
  .mark {
    font-size: 22px;
    font-weight: bold;
  }
  #preview {
    max-width: 100%;
    margin-top: 12px;
    border-radius: 8px;
  }
  .result {
    background: #fff8d6;
    padding: 12px;
    border-radius: 8px;
    margin-top: 10px;
  }
  .small {
    color: #666;
    font-size: 13px;
  }
</style>
</head>

<body>
<div class="container">
  <h1>🏇 競馬予想アプリ</h1>

  <div class="card">
    <h2>レース情報</h2>

    <label>開催日</label>
    <input type="date" id="raceDate">

    <label>競馬場</label>
    <input type="text" id="track" placeholder="例：中山">

    <label>レース番号</label>
    <input type="number" id="raceNumber" min="1" max="12" placeholder="例：11">

    <p class="small">
      ※開催日・競馬場・レース番号は手動で入力してください。
    </p>
  </div>

  <div class="card">
    <h2>出馬表スクショ</h2>

    <input type="file" id="imageInput" accept="image/*">

    <img id="preview" alt="出馬表プレビュー" hidden>

    <p class="small">
      ※画像はこの画面で確認するために使用します。
      現在は画像から馬名を自動読み取りする機能はありません。
    </p>
  </div>

  <div class="card">
    <h2>出走馬を入力</h2>

    <p class="small">
      馬番・馬名・印・評価点を入力してください。
    </p>

    <div id="horseInputs"></div>

    <button onclick="addHorse()">馬を追加する</button>
    <button onclick="makePrediction()">予想を作成する</button>
  </div>

  <div class="card">
    <h2>予想結果</h2>
    <div id="prediction">
      まだ予想を作成していません。
    </div>
  </div>
</div>

<script>
let horses = [];

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");

imageInput.addEventListener("change", function() {
  const file = this.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(event) {
    preview.src = event.target.result;
    preview.hidden = false;
  };

  reader.readAsDataURL(file);
});

function addHorse() {
  const number = horses.length + 1;

  horses.push({
    number: number,
    name: "",
    mark: "",
    score: 50
  });

  renderHorseInputs();
}

function renderHorseInputs() {
  const area = document.getElementById("horseInputs");
  area.innerHTML = "";

  horses.forEach((horse, index) => {
    const div = document.createElement("div");
    div.className = "horse";

    div.innerHTML = `
      <strong>${index + 1}頭目</strong>

      <label>馬番</label>
      <input type="number" value="${horse.number}"
        onchange="updateHorse(${index}, 'number', this.value)">

      <label>馬名</label>
      <input type="text" placeholder="馬名を入力"
        value="${horse.name}"
        onchange="updateHorse(${index}, 'name', this.value)">

      <label>印</label>
      <select onchange="updateHorse(${index}, 'mark', this.value)">
        <option value="">印なし</option>
        <option value="◎" ${horse.mark === "◎" ? "selected" : ""}>◎ 本命</option>
        <option value="○" ${horse.mark === "○" ? "selected" : ""}>○ 対抗</option>
        <option value="▲" ${horse.mark === "▲" ? "selected" : ""}>▲ 単穴</option>
        <option value="☆" ${horse.mark === "☆" ? "selected" : ""}>☆ 穴馬</option>
      </select>

      <label>評価点（0〜100）</label>
      <input type="number" min="0" max="100"
        value="${horse.score}"
        onchange="updateHorse(${index}, 'score', this.value)">
    `;

    area.appendChild(div);
  });
}

function updateHorse(index, key, value) {
  if (key === "score" || key === "number") {
    value = Number(value);
  }

  horses[index][key] = value;
}

function makePrediction() {
  const validHorses = horses
    .filter(horse => horse.name.trim() !== "")
    .sort((a, b) => b.score - a.score);

  if (validHorses.length < 2) {
    document.getElementById("prediction").innerHTML =
      "馬名を2頭以上入力してください。";
    return;
  }

  const date = document.getElementById("raceDate").value || "未入力";
  const track = document.getElementById("track").value || "未入力";
  const raceNumber = document.getElementById("raceNumber").value || "未入力";

  let html = `
    <p><strong>${date} ${track} ${raceNumber}R</strong></p>
    <p class="small">
      ※評価点を基準に並べた参考予想です。
      実際の勝率や的中を保証するものではありません。
    </p>
  `;

  validHorses.forEach((horse, index) => {
    const mark = horse.mark || (index === 0 ? "◎" :
      index === 1 ? "○" :
      index === 2 ? "▲" : "");

    html += `
      <div class="result">
        <span class="mark">${mark}</span>
        <strong>${horse.number}番 ${escapeHTML(horse.name)}</strong>
        <br>
        評価点：${horse.score}点
      </div>
    `;
  });

  const top = validHorses.slice(0, 3);

  if (top.length >= 2) {
    html += `
      <h3>買い目の参考</h3>
      <p>ワイド：${top.map(h => h.number + "番").join(" - ")}</p>
      <p>馬連：${top[0].number} - ${top[1].number}</p>
    `;
  }

  if (top.length >= 3) {
    html += `
      <p>3連複：${top.map(h => h.number + "番").join(" - ")}</p>
    `;
  }

  document.getElementById("prediction").innerHTML = html;
}

function escapeHTML(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

// 最初から3頭分の入力欄を用意
addHorse();
addHorse();
addHorse();
</script>
</body>
</html>
