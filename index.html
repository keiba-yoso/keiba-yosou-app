
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競馬予想アプリ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}
header{background:#123e70;color:white;padding:22px 16px}
main{max-width:700px;margin:auto;padding:15px}
.card{background:white;border-radius:15px;padding:18px;margin:15px 0;box-shadow:0 3px 15px #0001}
label{display:block;font-weight:bold;margin:12px 0 5px}
select,input,button{width:100%;padding:12px;font-size:16px;border-radius:9px;border:1px solid #ccd5e3}
button{background:#1769d2;color:white;border:0;font-weight:bold;margin-top:15px}
button.sub{background:#e7eef8;color:#173e70}
.notice{background:#fff1c9;padding:12px;border-radius:10px;font-size:13px}
.horse{padding:13px 0;border-bottom:1px solid #e6eaf0}
.rank{font-weight:bold;font-size:20px;color:#1769d2}
.tag{background:#e9f1ff;color:#1769d2;padding:4px 8px;border-radius:20px;font-size:12px}
.hidden{display:none}
</style>
</head>

<body>
<header>
<h1>🏇 競馬予想アプリ</h1>
<p>中央競馬・日本語予想版</p>
</header>

<main>

<div class="notice">
サンプルデータ版です。JRAの実際の出馬表・成績・オッズは未連携です。
</div>

<section class="card">
<h2>レースを選択</h2>

<label>開催日</label>
<input id="date" type="date">

<label>競馬場</label>
<select id="track">
<option>東京</option>
<option>中山</option>
<option>阪神</option>
<option>京都</option>
<option>中京</option>
<option>札幌</option>
<option>函館</option>
<option>福島</option>
<option>新潟</option>
<option>小倉</option>
</select>

<label>レース番号</label>
<select id="race">
<option>1R</option><option>2R</option>
<option>3R</option><option>4R</option>
<option>5R</option><option>6R</option>
<option>7R</option><option>8R</option>
<option>9R</option><option>10R</option>
<option>11R</option><option>12R</option>
</select>

<button onclick="makePrediction()">予想を作成する</button>
</section>

<section id="result" class="card hidden">
<h2 id="raceTitle">予想結果</h2>
<div id="prediction"></div>

<h3>おすすめ買い目</h3>
<div id="bets"></div>

<button class="sub" onclick="makePrediction()">予想を更新する</button>
</section>

</main>

<script>
const horses=[
{no:1,name:"サンプルスター",score:88},
{no:2,name:"ブルーファルコン",score:84},
{no:3,name:"ミライステップ",score:81},
{no:4,name:"グリーンハート",score:79},
{no:5,name:"ナイトブレード",score:76},
{no:6,name:"ハッピーラン",score:73},
{no:7,name:"オレンジムーン",score:71},
{no:8,name:"スピードリンク",score:68}
];

document.getElementById("date").value=
new Date().toISOString().slice(0,10);

function makePrediction(){

let result=horses.map(h=>({
...h,
score:h.score+Math.floor(Math.random()*11)-5
})).sort((a,b)=>b.score-a.score);

const date=document.getElementById("date").value;
const track=document.getElementById("track").value;
const race=document.getElementById("race").value;

document.getElementById("result").classList.remove("hidden");

document.getElementById("raceTitle").textContent=
date+" "+track+" "+race+"の予想";

document.getElementById("prediction").innerHTML=
result.map((h,i)=>{

let mark="";
let tag="相手候補";

if(i===0){mark="◎";tag="本命";}
else if(i===1){mark="○";tag="対抗";}
else if(i===2){mark="▲";tag="単穴";}
else if(i===3){mark="☆";tag="穴馬";}

return `
<div class="horse">
<span class="rank">${i+1}位 ${mark}</span>
<br>
<strong>${h.no}番 ${h.name}</strong>
<br>
スコア：${h.score}
<span class="tag">${tag}</span>
</div>
`;

}).join("");

const a=result.slice(0,3).map(h=>h.no+"番");

document.getElementById("bets").innerHTML=`
<p><strong>本命：</strong>${a[0]}</p>
<p><strong>対抗：</strong>${a[1]}</p>
<p><strong>単穴：</strong>${a[2]}</p>
<hr>
<p><strong>ワイド候補：</strong>${a[0]}-${a[1]} / ${a[0]}-${a[2]}</p>
<p><strong>馬連候補：</strong>${a[0]}-${a[1]}</p>
<p><strong>三連複候補：</strong>${a.join("-")}</p>
<p><strong>三連単候補：</strong>${a.join("→")}</p>
`;

}
</script>

</body>
</html>
