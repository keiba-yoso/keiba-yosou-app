<body>

<div class="container">

<script>

const centralTracks = [
  "札幌",
  "函館",
  "福島",
  "新潟",
  "東京",
  "中山",
  "中京",
  "京都",
  "阪神",
  "小倉"
];

const localTracks = [
  "門別",
  "帯広ばんえい",
  "盛岡",
  "水沢",
  "浦和",
  "船橋",
  "大井",
  "川崎",
  "金沢",
  "笠松",
  "名古屋",
  "園田",
  "姫路",
  "高知",
  "佐賀"
];

function updateTrackList() {

  const category = document.getElementById("category").value;
  const trackSelect = document.getElementById("track");

  const tracks =
    category === "local"
      ? localTracks
      : centralTracks;

  trackSelect.innerHTML = "";

  tracks.forEach(track => {

    const option = document.createElement("option");

    option.value = track;
    option.textContent = track;

    trackSelect.appendChild(option);

  });

  updatePromptPreview();

}

function getJapanDate() {

  const now = new Date();

  const japanDate = new Intl.DateTimeFormat(
    "ja-JP",
    {
      timeZone: "Asia/Tokyo",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }
  ).formatToParts(now);

  const year = japanDate.find(
    item => item.type === "year"
  ).value;

  const month = japanDate.find(
    item => item.type === "month"
  ).value;

  const day = japanDate.find(
    item => item.type === "day"
  ).value;

  return `${year}-${month}-${day}`;

}

function getRaceInfo() {

  const categoryValue =
    document.getElementById("category").value;

  const categoryName =
    categoryValue === "central"
      ? "中央競馬（JRA）"
      : "地方競馬";

  return {

    date:
      document.getElementById("raceDate").value
      || "未入力",

    raceNumber:
      document.getElementById("raceNumber").value
      || "未入力",

    category:
      categoryName,

    track:
      document.getElementById("track").value
      || "未入力",

    distance:
      document.getElementById("distance").value
      || "未入力・自動判定",

    trackCondition:
      document.getElementById("trackCondition").value
      || "未入力・要確認",

    weather:
      document.getElementById("weather").value
      || "未入力・要確認",

    course:
      document.getElementById("course").value
      || "未入力・自動判定",

    ocrText:
      document.getElementById("ocrText").value.trim()
      || "OCR情報なし",

    additionalInfo:
      document.getElementById("additionalInfo").value.trim()
      || "追加情報なし"

  };

}

function createPrompt() {

  const race = getRaceInfo();

  return `あなたは中央競馬・地方競馬のレース分析に対応した競馬予想アシスタントです。

以下のレース情報と、出馬表OCR結果をもとに、可能な範囲で客観的かつ具体的に分析してください。

━━━━━━━━━━━━━━━━━━
【最重要ルール】
━━━━━━━━━━━━━━━━━━

1. 開催日・競馬場・レース番号を最初に確認する
2. OCRの誤認識が疑われる場合は、確定情報として扱わない
3. 出馬表に存在しない馬名・馬番・騎手名を作らない
4. 情報が不足している場合は、不足していると明記する
5. オッズが入力されていない場合、具体的なオッズを創作しない
6. 天候・馬場・展開は、確定情報と予測を分けて記載する
7. 最新情報を確認できない場合は、確認できていないと明記する
8. 予想は断定ではなく、分析に基づく参考情報として提示する
9. 買い目は点数が多くなりすぎないように絞る
10. 馬番と馬名が一致しているか、買い目作成前に再確認する

━━━━━━━━━━━━━━━━━━
【レース情報】
━━━━━━━━━━━━━━━━━━

開催区分：${race.category}
開催日：${race.date}
競馬場：${race.track}
レース番号：${race.raceNumber}R
距離：${race.distance}
コース：${race.course}
馬場状態：${race.trackCondition}
天候：${race.weather}

━━━━━━━━━━━━━━━━━━
【出馬表OCR結果】
━━━━━━━━━━━━━━━━━━

${race.ocrText}

━━━━━━━━━━━━━━━━━━
【追加情報】
━━━━━━━━━━━━━━━━━━

${race.additionalInfo}

━━━━━━━━━━━━━━━━━━
【分析してほしい内容】
━━━━━━━━━━━━━━━━━━

以下の順番で、初心者にも分かりやすく分析してください。

■1. レース情報の確認

・開催日
・競馬場
・レース番号
・距離
・芝またはダート
・馬場状態
・天候
・OCRの誤認識や不足情報

レース情報に矛盾があれば、予想前に指摘してください。

■2. 展開予想

・逃げそうな馬
・先行馬
・差し馬
・追い込み馬
・ハナを切る可能性がある馬
・ペース予想
・前残りになりそうか
・差しが届きそうか
・展開で有利になりそうな馬
・展開で不利になりそうな馬

■3. 各馬の評価

可能な範囲で以下を評価してください。

・近走成績
・相手関係
・距離適性
・競馬場適性
・芝・ダート適性
・馬場適性
・脚質
・騎手
・斤量
・枠順
・先行力
・末脚
・安定感
・休み明けやローテーション
・地方競馬の場合は所属・競走条件・クラス実績

情報がない項目は「不明」としてください。

■4. 印の提示

以下の形式で提示してください。

◎ 本命：
○ 対抗：
▲ 単穴：
△ 連下：
☆ 穴馬：
注 注意馬：

各馬について、短い理由も記載してください。

出馬表に存在しない馬を選ばないでください。

■5. 軸馬の選定

以下を分けて説明してください。

・勝ち切り期待の軸馬
・連軸として安定しそうな馬
・相手に入れたい馬
・穴として面白い馬
・人気でも危険性がある可能性の馬

■6. 買い目の作成

必ず以下の買い目を作成してください。

【A. 馬連】

本線を数点。
押さえがあれば少数提示。

【B. ワイド】

軸馬を中心に、的中可能性と妙味を考慮して提示。

【C. 三連複1頭軸】

軸馬を1頭選び、相手を絞って提示。

【D. 三連複2頭軸】

必ず作成してください。

形式：

三連複2頭軸：
軸：
相手：
買い目：

例：
軸：1・5
相手：2・3・7・9
買い目：
1-2-5
1-3-5
1-5-7
1-5-9

※例の馬番は実際の出馬表から選び直してください。
※実際に存在しない馬番は使用しないでください。
※相手が多すぎる場合は、最大5頭程度までに絞ってください。

【E. 三連単フォーメーション】

必ず作成してください。

以下の形式で提示してください。

三連単フォーメーション：

1着：
2着：
3着：

買い目：
1着→2着→3着の組み合わせを列挙

基本は以下の考え方で作成してください。

・1着固定型
・1着と2着の入れ替え
・穴馬を3着に入れる形
・本命が崩れた場合の押さえ
・点数が多くなりすぎないようにする

原則として、買い目は最大20点程度を目安にしてください。
ただし、出走頭数やレース状況により調整してください。

【F. 穴狙いの買い目】

人気薄の可能性がある馬で、以下を提示してください。

・穴馬の理由
・穴馬を絡めたワイド
・穴馬を絡めた三連複
・穴馬を絡めた三連単

人気薄かどうかを判断できるオッズがない場合は、
「人気薄かどうかは未確認」と記載してください。

■7. 買い目の優先順位

以下のように分類してください。

・最優先買い目
・本線
・押さえ
・穴狙い
・買いすぎ防止のため削る買い目

■8. 最終結論

最後に短くまとめてください。

・本命馬
・対抗馬
・穴馬
・最も重視する買い目
・三連複2頭軸
・三連単フォーメーション
・展開のポイント
・予想の不確実な部分

━━━━━━━━━━━━━━━━━━
【出力上の注意】
━━━━━━━━━━━━━━━━━━

・馬番と馬名を併記する
・買い目は実際の出馬表にある馬だけで作成する
・不明な情報は不明と書く
・存在しないオッズを作らない
・過度に買い目を増やさない
・初心者でも分かるように簡潔に説明する
・最後は「ズバッと」要点をまとめる

以上の条件でレースを分析してください。`;

async function runOCR() {

  const fileInput =
    document.getElementById("imageInput");

  const file = fileInput.files[0];

  const status =
    document.getElementById("ocrStatus");

  const progressBar =
    document.getElementById("progressBar");

  const ocrText =
    document.getElementById("ocrText");

  if (!file) {

    alert("先に出馬表の画像を選択してください。");
    return;

  }

  try {

    status.textContent =
      "OCRを開始しています。少し待ってください。";

    progressBar.style.width = "0%";
    ocrText.value = "";

    const result = await Tesseract.recognize(
      file,
      "jpn+eng",
      {
        logger: message => {

          if (message.status === "recognizing text") {

            const progress =
              Math.round((message.progress || 0) * 100);

            progressBar.style.width =
              progress + "%";

            status.textContent =
              `OCR読み取り中：${progress}%`;

          } else {

            status.textContent =
              `処理中：${message.status}`;

          }

        }
      }
    );

    const text =
      result.data.text || "";

    ocrText.value = text.trim();

    progressBar.style.width = "100%";

    status.textContent =
      "OCRが完了しました。誤認識がないか確認してください。";

    updatePromptPreview();

  } catch (error) {

    console.error(error);

    status.textContent =
      "OCR中にエラーが発生しました。画像を変えて再試行してください。";

    alert("OCRに失敗しました。画像サイズや画質を確認してください。");

  }

}

function updatePromptPreview() {

  const preview =
    document.getElementById("promptPreview");

  if (!preview) {
    return;
  }

  preview.textContent = createPrompt();

}

function sendToChatGPT() {

  const prompt =
    createPrompt();

  if (!prompt.trim()) {

    alert("送信する内容がありません。");
    return;

  }

  const chatGPTUrl =
    "https://chatgpt.com/?q=" +
    encodeURIComponent(prompt);

  window.open(chatGPTUrl, "_blank");

}

async function copyPrompt() {

  const prompt =
    createPrompt();

  try {

    await navigator.clipboard.writeText(prompt);

    alert("プロンプトをコピーしました。ChatGPTに貼り付けてください。");

  } catch (error) {

    const temporaryTextarea =
      document.createElement("textarea");

    temporaryTextarea.value = prompt;

    document.body.appendChild(temporaryTextarea);

    temporaryTextarea.select();

    document.execCommand("copy");

    temporaryTextarea.remove();

    alert("プロンプトをコピーしました。");

  }

}

document.addEventListener("DOMContentLoaded", () => {

  document.getElementById("raceDate").value =
    getJapanDate();

  updateTrackList();

  updatePromptPreview();

});

[
  "raceDate",
  "raceNumber",
  "category",
  "track",
  "distance",
  "trackCondition",
  "weather",
  "course",
  "ocrText",
  "additionalInfo"
].forEach(id => {

  const element =
    document.getElementById(id);

  if (!element) {
    return;
  }

  element.addEventListener("input", updatePromptPreview);
  element.addEventListener("change", updatePromptPreview);

});

</script>
