
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競馬予想アプリ 中央・地方対応</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;background:#f3f5f7;color:#222;margin:0;padding:16px;line-height:1.6}
.container{max-width:900px;margin:auto;background:#fff;padding:22px;border-radius:16px;box-shadow:0 4px 18px #0001}
h1{text-align:center;color:#176b3a;font-size:24px}
h2{font-size:18px;margin-top:26px;padding:10px 12px;background:#e9f5ed;border-left:5px solid #218c4b;border-radius:6px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-group{display:flex;flex-direction:column}
.full{grid-column:1/-1}
label{font-weight:bold;font-size:13px;margin-bottom:5px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd3d9;border-radius:8px;background:#fff}
textarea{resize:vertical;min-height:130px}
button{border:0;border-radius:9px;padding:13px 16px;cursor:pointer;font-weight:bold}
button:disabled{opacity:.5}
.primary-button{background:#176b3a;color:#fff}
.secondary-button{background:#2474c6;color:#fff}
.copy-button{background:#555;color:#fff}
.button-area{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.notice{background:#fff8df;border:1px solid #ead38a;padding:12px;border-radius:8px;font-size:13px;margin-top:12px}
.status{margin-top:12px;padding:10px;border-radius:8px;background:#f0f3f5;font-size:13px;white-space:pre-wrap}
.progress-wrapper{margin-top:12px;background:#e5e7eb;height:12px;border-radius:999px;overflow:hidden}
.progress-bar{width:0%;height:100%;background:#218c4b;transition:width .2s}
.preview{min-height:220px;background:#f7f8fa;border:1px solid #dfe4e8;border-radius:8px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
.small-text{font-size:12px;color:#666;margin-top:5px}
.required{color:#d62828}
@media(max-width:600px){
body{padding:8px}
.container{padding:14px}
.form-grid,.button-area{grid-template-columns:1fr}
h1{font-size:21px}
}
</style>
</head>

<body>
<div class="container">

<h1>競馬予想アプリ</h1>
<div style="text-align:center;color:#666;font-size:13px">
中央競馬・地方競馬対応／OCR／印の頭数増加／買い目作成
</div>

<h2>レース情報</h2>

<div class="form-grid">

<div class="form-group">
<label>開催日 *</label>
<input type="date" id="raceDate">
</div>

<div class="form-group">
<label>レース番号 *</label>
<select id="raceNumber">
<option value="">選択してください</option>
<option>1</option><option>2</option><option>3</option>
<option>4</option><option>5</option><option>6</option>
<option>7</option><option>8</option><option>9</option>
<option>10</option><option selected>11</option><option>12</option>
</select>
</div>

<div class="form-group">
<label>開催区分 *</label>
<select id="category">
<option value="central">中央競馬（JRA）</option>
<option value="local">地方競馬</option>
</select>
</div>

<div class="form-group">
<label>競馬場 *</label>
<select id="track"></select>
</div>

<div class="form-group">
<label>距離</label>
<select id="distance">
<option value="">未入力・自動判定</option>
<option>1000m</option><option>1150m</option><option>1200m</option>
<option>1300m</option><option>1400m</option><option>1500m</option>
<option>1600m</option><option>1700m</option><option>1800m</option>
<option>1900m</option><option>2000m</option><option>2100m</option>
<option>2200m</option><option>2300m</option><option>2400m</option>
<option>2500m</option><option>2600m</option><option>3000m</option>
<option>3200m</option>
</select>
</div>

<div class="form-group">
<label>馬場状態</label>
<select id="trackCondition">
<option value="">未入力・自動確認</option>
<option>良</option><option>稍重</option><option>重</option>
<option>不良</option><option>不明</option>
</select>
</div>

<div class="form-group">
<label>天候</label>
<select id="weather">
<option value="">未入力・自動確認</option>
<option>晴</option><option>曇</option><option>雨</option>
<option>小雨</option><option>雪</option><option>不明</option>
</select>
</div>

<div class="form-group">
<label>コース</label>
<select id="course">
<option value="">未入力・自動判定</option>
<option>芝</option><option>ダート</option><option>障害</option><option>不明</option>
</select>
</div>

</div>

<h2>出馬表OCR</h2>

<label>出馬表スクリーンショット</label>
<input type="file" id="imageInput" accept="image/*">

<div class="small-text">
画像全体が写っているスクリーンショットを選択してください。
</div>

<div class="notice">
<strong>OCR列の順番</strong><br>
人気 → 馬番 → 馬名 → 単勝オッズ → 複勝オッズ<br><br>
OCR後は馬番・馬名・オッズの対応を必ず目視確認してください。
</div>

<button class="primary-button" onclick="runOCR()" style="margin-top:12px;width:100%">
出馬表をOCRで読み取る
</button>

<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="ocrStatus" class="status">OCR待機中です。</div>

<h2>OCR読み取り結果</h2>
<textarea id="ocrText" placeholder="OCR結果がここに表示されます。誤認識は修正してください。"></textarea>

<h2>追加情報</h2>
<textarea id="additionalInfo" placeholder="単勝オッズ：
複勝オッズ：
馬体重：
騎手変更：
天候：
馬場：
気になる馬：
逃げ馬：
その他："></textarea>

<div class="notice">
<strong>注意：</strong>
入力されていない情報や最新情報を確認できない場合は、
不明・未確認として扱います。オッズを創作しません。
</div>

<div class="button-area">
<button class="primary-button" onclick="sendToChatGPT()">ChatGPTで予想する</button>
<button class="copy-button" onclick="copyPrompt()">プロンプトをコピー</button>
</div>

<h2>作成されたプロンプト</h2>
<div id="promptPreview" class="preview">ここにプロンプトが表示されます。</div>

</div>

<script>

const centralTracks=[
"札幌","函館","福島","新潟","東京",
"中山","中京","京都","阪神","小倉"
];

const localTracks=[
"門別","帯広ばんえい","盛岡","水沢","浦和",
"船橋","大井","川崎","金沢","笠松",
"名古屋","園田","姫路","高知","佐賀"
];

function updateTrackList(){

const category=document.getElementById("category").value;
const select=document.getElementById("track");

select.innerHTML="";

const tracks=category==="local"?localTracks:centralTracks;

tracks.forEach(track=>{
const option=document.createElement("option");
option.value=track;
option.textContent=track;
select.appendChild(option);
});

updatePromptPreview();

}

document.getElementById("category").addEventListener("change",updateTrackList);

function getJapanDate(){

const parts=new Intl.DateTimeFormat("ja-JP",{
timeZone:"Asia/Tokyo",
year:"numeric",
month:"2-digit",
day:"2-digit"
}).formatToParts(new Date());

const y=parts.find(x=>x.type==="year").value;
const m=parts.find(x=>x.type==="month").value;
const d=parts.find(x=>x.type==="day").value;

return `${y}-${m}-${d}`;

}

function getRaceInfo(){

const category=document.getElementById("category").value;

return{

date:document.getElementById("raceDate").value||"未入力",

raceNumber:document.getElementById("raceNumber").value||"未入力",

category:category==="central"?"中央競馬（JRA）":"地方競馬",

track:document.getElementById("track").value||"未入力",

distance:document.getElementById("distance").value||"未入力・自動判定",

trackCondition:document.getElementById("trackCondition").value||"未入力・要確認",

weather:document.getElementById("weather").value||"未入力・要確認",

course:document.getElementById("course").value||"未入力・自動判定",

ocrText:document.getElementById("ocrText").value.trim()||"OCR情報なし",

additionalInfo:document.getElementById("additionalInfo").value.trim()||"追加情報なし"

};

}

function createPrompt(){

const race=getRaceInfo();

return `あなたは中央競馬・地方競馬に対応した競馬予想アシスタントです。

以下のレース情報とOCR出馬表を使って、初心者にも分かりやすく具体的に分析してください。

━━━━━━━━━━━━━━━━━━
【最重要ルール】
━━━━━━━━━━━━━━━━━━

1. 開催日・競馬場・レース番号を最初に確認する。
2. OCRの誤認識が疑われる場合は確定情報にしない。
3. 出馬表にない馬番・馬名・騎手を作らない。
4. 馬番と馬名の対応を確認してから印と買い目を作る。
5. 入力されていないオッズを創作しない。
6. 確定情報・推測・未確認情報を分ける。
7. 最新情報を確認できない場合は未確認と記載する。
8. 買い目は点数を絞る。
9. 馬番・馬名・オッズの対応を最終確認する。

━━━━━━━━━━━━━━━━━━
【OCR列の順番】
━━━━━━━━━━━━━━━━━━

画像の基本列順：

1列目：人気
2列目：馬番
3列目：馬名
4列目：単勝オッズ
5列目：複勝オッズ

人気と馬番を混同しないこと。
単勝オッズと複勝オッズを混同しないこと。
列の位置が不明な場合は要確認とすること。
数字や馬名を推測で補完しないこと。

━━━━━━━━━━━━━━━━━━
【レース情報】
━━━━━━━━━━━━━━━━━━

開催区分：${race.category}
開催日：${race.date}
競馬場：${race.track}
レース番号：${race.raceNumber}R
距離：${race.distance}
コース：${race.course}
馬場状態：${race.trackCondition}
天候：${race.weather}

━━━━━━━━━━━━━━━━━━
【OCR出馬表】
━━━━━━━━━━━━━━━━━━

${race.ocrText}

━━━━━━━━━━━━━━━━━━
【追加情報】
━━━━━━━━━━━━━━━━━━

${race.additionalInfo}

━━━━━━━━━━━━━━━━━━
【1. レース情報確認】
━━━━━━━━━━━━━━━━━━

開催日・競馬場・レース番号・距離・コース・馬場・天候を確認する。
OCRの誤認識・不足・矛盾があれば最初に指摘する。

━━━━━━━━━━━━━━━━━━
【2. 出馬表整理】
━━━━━━━━━━━━━━━━━━

可能な範囲で以下の表に整理する。

人気 | 馬番 | 馬名 | 単勝オッズ | 複勝オッズ

不明な項目は不明とする。
馬番と馬名の対応が不確実なら要確認とする。

━━━━━━━━━━━━━━━━━━
【3. 展開予想】
━━━━━━━━━━━━━━━━━━

逃げ・先行・差し・追込・ハナを切る可能性・ペース・前残り・差し有利・展開有利馬・展開不利馬を説明する。

━━━━━━━━━━━━━━━━━━
【4. 各馬の評価】
━━━━━━━━━━━━━━━━━━

近走成績・相手関係・距離適性・競馬場適性・芝ダート適性・馬場適性・脚質・騎手・斤量・枠順・先行力・末脚・安定感・ローテーションを評価する。
地方競馬は所属・クラス・競走条件も確認する。
情報がない項目は不明とする。

━━━━━━━━━━━━━━━━━━
【5. 印の頭数ルール】
━━━━━━━━━━━━━━━━━━

印は必ず以下の頭数で選ぶこと。

◎ 本命：1頭
○ 対抗：2頭
▲ 単穴：3頭
△ 連下：4頭
☆ 穴馬：5頭
注 注意馬：6頭

◎は必ず1頭。
○は必ず2頭。
▲は必ず3頭。
△は必ず4頭。
☆は必ず5頭。
注は必ず6頭。

各印は指定頭数を守る。
ただし、出走頭数や情報不足により選定できない場合は、
「該当なし（理由）」と記載する。

出馬表に存在しない馬は選ばない。

各馬に馬番・馬名・短い理由をつける。

━━━━━━━━━━━━━━━━━━
【6. 軸馬の選定】
━━━━━━━━━━━━━━━━━━

勝ち切り期待の軸馬・連軸・相手候補・穴候補・人気でも不安材料がある馬を分けて説明する。

━━━━━━━━━━━━━━━━━━
【7. 買い目】
━━━━━━━━━━━━━━━━━━

馬連：本線・押さえ
ワイド：軸中心
三連複1頭軸：相手を絞る
三連複2頭軸：必ず作成
三連単フォーメーション：最大20点程度を目安
穴狙い：ワイド・三連複・三連単

実際に存在する馬番のみを使用する。
買い目は増やしすぎない。

━━━━━━━━━━━━━━━━━━
【8. 買い目の優先順位】
━━━━━━━━━━━━━━━━━━

最優先買い目・本線・押さえ・穴狙い・削る買い目を分ける。

━━━━━━━━━━━━━━━━━━
【9. 最終結論】
━━━━━━━━━━━━━━━━━━

本命・対抗・穴馬・最重視買い目・三連複2頭軸・三連単フォーメーション・展開のポイント・不確実な情報を短くまとめる。

━━━━━━━━━━━━━━━━━━
【最終チェック】
━━━━━━━━━━━━━━━━━━

□ ◎は1頭
□ ○は2頭
□ ▲は3頭
□ △は4頭
□ ☆は5頭
□ 注は6頭
□ 馬番と馬名が一致
□ 買い目の馬番が存在
□ 人気と馬番を混同していない
□ 単勝・複勝オッズを混同していない
□ 不明情報を創作していない

最後は「ズバッと」要点をまとめてください。`;

}

async function preprocessImage(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=e=>{

const img=new Image();

img.onload=()=>{

const scale=2;
const canvas=document.createElement("canvas");

canvas.width=img.width*scale;
canvas.height=img.height*scale;

const ctx=canvas.getContext("2d",{willReadFrequently:true});

ctx.drawImage(img,0,0,canvas.width,canvas.height);

const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
const data=imageData.data;

for(let i=0;i<data.length;i+=4){

const gray=.299*data[i]+.587*data[i+1]+.114*data[i+2];

const adjusted=Math.max(0,Math.min(255,(gray-128)*1.4+128));

data[i]=adjusted;
data[i+1]=adjusted;
data[i+2]=adjusted;

}

ctx.putImageData(imageData,0,0);

canvas.toBlob(blob=>{

if(!blob){
reject(new Error("画像処理に失敗しました"));
return;
}

resolve(blob);

},"image/png");

};

img.onerror=()=>reject(new Error("画像を読み込めませんでした"));
img.src=e.target.result;

};

reader.onerror=()=>reject(new Error("ファイル読み込みに失敗しました"));
reader.readAsDataURL(file);

});

}

async function runOCR(){

const file=document.getElementById("imageInput").files[0];

const status=document.getElementById("ocrStatus");
const progressBar=document.getElementById("progressBar");
const ocrText=document.getElementById("ocrText");

if(!file){
alert("先に出馬表の画像を選択してください。");
return;
}

try{

status.textContent="OCR用画像を作成しています。";
progressBar.style.width="0%";
ocrText.value="";

const image=await preprocessImage(file);

status.textContent="OCRを開始しています。";

const result=await Tesseract.recognize(image,"jpn+eng",{

logger:message=>{

if(message.status==="recognizing text"){

const progress=Math.round((message.progress||0)*100);

progressBar.style.width=progress+"%";
status.textContent=`OCR読み取り中：${progress}%`;

}else{

status.textContent=`処理中：${message.status}`;

}

}

});

ocrText.value=(result.data.text||"").trim();

progressBar.style.width="100%";
status.textContent="OCR完了。誤認識を確認してください。";

updatePromptPreview();

}catch(error){

console.error(error);
status.textContent="OCR中にエラーが発生しました。";
alert("OCRに失敗しました。画像を変えて再試行してください。");

}

}

function updatePromptPreview(){

document.getElementById("promptPreview").textContent=createPrompt();

}

function sendToChatGPT(){

const prompt=createPrompt();

const url="https://chatgpt.com/?q="+encodeURIComponent(prompt);

window.open(url,"_blank");

}

async function copyPrompt(){

const prompt=createPrompt();

try{

await navigator.clipboard.writeText(prompt);
alert("プロンプトをコピーしました。");

}catch(error){

const textarea=document.createElement("textarea");

textarea.value=prompt;
document.body.appendChild(textarea);
textarea.select();
document.execCommand("copy");
textarea.remove();

alert("プロンプトをコピーしました。");

}

}

document.addEventListener("DOMContentLoaded",()=>{

document.getElementById("raceDate").value=getJapanDate();

updateTrackList();
updatePromptPreview();

[
"raceDate","raceNumber","category","track",
"distance","trackCondition","weather",
"course","ocrText","additionalInfo"
].forEach(id=>{

const element=document.getElementById(id);

if(!element)return;

element.addEventListener("input",updatePromptPreview);
element.addEventListener("change",updatePromptPreview);

});

});

</script>
</body>
</html>
