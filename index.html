
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>競馬予想アプリ 中央・地方対応</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background: #f1f3f5;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #176b3a;
      font-size: 24px;
      margin: 10px 0 20px;
    }

    h2 {
      font-size: 19px;
      color: #176b3a;
      border-bottom: 2px solid #176b3a;
      padding-bottom: 7px;
    }

    .card {
      background: #fff;
      padding: 17px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000012;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .form-group {
      margin-bottom: 13px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 5px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #c8cdd2;
      border-radius: 7px;
      font-size: 15px;
      background: #fff;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background: #176b3a;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.88;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .blue {
      background: #356aa8;
    }

    .orange {
      background: #d4771c;
    }

    .gray {
      background: #555;
    }

    .red {
      background: #b52c2c;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #edf6ef;
      color: #176b3a;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .warning {
      background: #fff3dc;
      color: #855500;
    }

    .error {
      background: #ffe7e7;
      color: #a00000;
    }

    .preview {
      display: none;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .small {
      color: #666;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .grid,
      .button-grid {
        grid-template-columns: 1fr;
      }

      body {
        padding: 8px;
      }

      .card {
        padding: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🏇 競馬予想分析アプリ</h1>

    <!-- レース情報 -->

    <section class="card">

      <h2>① レース情報</h2>

      <div class="grid">

        <div class="form-group">
          <label for="raceDate">開催日</label>
          <input type="date" id="raceDate">
        </div>

        <div class="form-group">
          <label for="category">開催区分</label>
          <select id="category">
            <option value="中央競馬（JRA）">中央競馬（JRA）</option>
            <option value="地方競馬">地方競馬</option>
          </select>
        </div>

        <div class="form-group">
          <label for="track">競馬場</label>
          <input id="track" placeholder="例：中山、阪神、笠松、浦和">
        </div>

        <div class="form-group">
          <label for="raceNumber">レース番号</label>
          <input id="raceNumber" type="number" min="1" max="12" placeholder="例：11">
        </div>

        <div class="form-group">
          <label for="distance">距離</label>
          <input id="distance" placeholder="例：芝1600m、ダート1400m">
        </div>

        <div class="form-group">
          <label for="course">コース・条件</label>
          <input id="course" placeholder="例：3歳未勝利、G1、右回り">
        </div>

        <div class="form-group">
          <label for="weather">天気</label>
          <select id="weather">
            <option value="未確認">未確認</option>
            <option value="晴れ">晴れ</option>
            <option value="曇り">曇り</option>
            <option value="雨">雨</option>
            <option value="小雨">小雨</option>
            <option value="雪">雪</option>
          </select>
        </div>

        <div class="form-group">
          <label for="trackCondition">馬場状態</label>
          <select id="trackCondition">
            <option value="未確認">未確認</option>
            <option value="良">良</option>
            <option value="稍重">稍重</option>
            <option value="重">重</option>
            <option value="不良">不良</option>
          </select>
        </div>

        <div class="form-group">
          <label for="predictionStyle">予想スタイル</label>
          <select id="predictionStyle">
            <option value="バランス型">バランス型</option>
            <option value="堅実型">堅実型</option>
            <option value="穴狙い">穴狙い</option>
            <option value="回収率重視">回収率重視</option>
            <option value="高配当狙い">高配当狙い</option>
          </select>
        </div>

        <div class="form-group">
          <label for="budget">想定購入金額</label>
          <select id="budget">
            <option value="1000円">1,000円</option>
            <option value="2000円">2,000円</option>
            <option value="3000円">3,000円</option>
            <option value="5000円">5,000円</option>
            <option value="10000円">10,000円</option>
            <option value="指定なし">指定なし</option>
          </select>
        </div>

      </div>

      <div class="form-group">
        <label for="additionalInfo">追加情報</label>
        <textarea id="additionalInfo"
          placeholder="例：逃げ馬が多い、内枠有利、前走不利があった馬など"></textarea>
      </div>

      <div class="form-group">
        <label for="customPrompt">追加指示</label>
        <textarea id="customPrompt"
          placeholder="例：3連複を中心に考えて。買い目は少なめに。"></textarea>
      </div>

    </section>

    <!-- OCR -->

    <section class="card">

      <h2>② 出馬表OCR</h2>

      <p class="small">
        出馬表のスクリーンショットを選択し、OCRを実行してください。
      </p>

      <div class="form-group">
        <label for="imageInput">出馬表画像</label>
        <input type="file" id="imageInput" accept="image/*">
      </div>

      <img id="imagePreview" class="preview" alt="出馬表プレビュー">

      <button id="ocrButton" type="button" onclick="runOCR()">
        🔍 OCRを実行
      </button>

      <div id="ocrStatus" class="status">
        OCR待機中
      </div>

      <div class="form-group">
        <label for="ocrText">OCR読み取り結果</label>
        <textarea id="ocrText"
          placeholder="OCR結果がここに表示されます。誤認識があれば手動で修正できます。"></textarea>
      </div>

      <button type="button" class="gray" onclick="formatOCRText()">
        📝 OCR結果を整形
      </button>

    </section>

    <!-- プロンプト -->

    <section class="card">

      <h2>③ 予想プロンプト</h2>

      <textarea id="promptOutput"
        placeholder="プロンプト作成ボタンを押すと、ここに予想指示が表示されます。"></textarea>

      <div class="button-grid">

        <button type="button" onclick="showPrompt()">
          📄 プロンプト作成
        </button>

        <button type="button" class="blue" onclick="copyPrompt()">
          📋 プロンプトをコピー
        </button>

        <button type="button" class="orange" onclick="openChatGPT()">
          🤖 ChatGPTで予想する
        </button>

        <button type="button" class="gray" onclick="checkMarkCounts()">
          🔎 印の頭数チェック
        </button>

      </div>

      <div id="markCheck" class="status">
        印のチェック待機中
      </div>

    </section>

  </div>

  <script>

    "use strict";

    let selectedImage = null;

    /*
      ページ読み込み時
    */

    document.addEventListener("DOMContentLoaded", function () {

      const dateInput = document.getElementById("raceDate");

      if (dateInput) {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, "0");
        const dd = String(today.getDate()).padStart(2, "0");

        dateInput.value = `${yyyy}-${mm}-${dd}`;
      }

      const imageInput = document.getElementById("imageInput");

      if (imageInput) {
        imageInput.addEventListener("change", function (event) {

          const file = event.target.files[0];

          if (!file) {
            selectedImage = null;
            return;
          }

          selectedImage = file;

          const preview = document.getElementById("imagePreview");
          const imageUrl = URL.createObjectURL(file);

          preview.src = imageUrl;
          preview.style.display = "block";

          setStatus(
            "ocrStatus",
            "画像を読み込みました。OCRを実行してください。",
            "normal"
          );

        });
      }

    });

    /*
      ステータス表示
    */

    function setStatus(elementId, message, type = "normal") {

      const element = document.getElementById(elementId);

      if (!element) {
        return;
      }

      element.textContent = message;

      element.classList.remove("warning", "error");

      if (type === "warning") {
        element.classList.add("warning");
      }

      if (type === "error") {
        element.classList.add("error");
      }

    }

    /*
      OCR実行
    */

    async function runOCR() {

      const fileInput = document.getElementById("imageInput");
      const button = document.getElementById("ocrButton");

      const file = fileInput.files[0];

      if (!file) {

        setStatus(
          "ocrStatus",
          "先に出馬表の画像を選択してください。",
          "warning"
        );

        return;
      }

      if (typeof Tesseract === "undefined") {

        setStatus(
          "ocrStatus",
          "OCRライブラリの読み込みに失敗しました。ページを再読み込みしてください。",
          "error"
        );

        return;
      }

      button.disabled = true;
      button.textContent = "⏳ OCR処理中...";

      setStatus(
        "ocrStatus",
        "画像を処理しています。しばらくお待ちください。",
        "normal"
      );

      try {

        const image = await loadImage(file);

        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");

        const scale = 3;

        canvas.width = image.width * scale;
        canvas.height = image.height * scale;

        context.drawImage(
          image,
          0,
          0,
          canvas.width,
          canvas.height
        );

        const imageData = context.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

        const data = imageData.data;

        for (let i = 0; i < data.length; i += 4) {

          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];

          const gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;

          const contrast =
            gray > 160 ? 255 : 0;

          data[i] = contrast;
          data[i + 1] = contrast;
          data[i + 2] = contrast;

        }

        context.putImageData(imageData, 0, 0);

        const result = await Tesseract.recognize(
          canvas,
          "jpn+eng",
          {
            logger: function (info) {

              if (info.status && info.progress !== undefined) {

                const progress =
                  Math.round(info.progress * 100);

                setStatus(
                  "ocrStatus",
                  `${info.status}\n進行状況：${progress}%`,
                  "normal"
                );

              }

            }
          }
        );

        const text =
          result &&
          result.data &&
          result.data.text
            ? result.data.text.trim()
            : "";

        if (!text) {

          setStatus(
            "ocrStatus",
            "文字を読み取れませんでした。画像を大きくするか、鮮明な画像を使用してください。",
            "warning"
          );

          document.getElementById("ocrText").value = "";

        } else {

          document.getElementById("ocrText").value = text;

          setStatus(
            "ocrStatus",
            "OCRが完了しました。読み取り結果を確認してください。",
            "normal"
          );

        }

      } catch (error) {

        console.error("OCR error:", error);

        setStatus(
          "ocrStatus",
          "OCR中にエラーが発生しました。\n" + error.message,
          "error"
        );

      } finally {

        button.disabled = false;
        button.textContent = "🔍 OCRを実行";

      }

    }

    /*
      画像読み込み
    */

    function loadImage(file) {

      return new Promise(function (resolve, reject) {

        const image = new Image();
        const url = URL.createObjectURL(file);

        image.onload = function () {

          URL.revokeObjectURL(url);
          resolve(image);

        };

        image.onerror = function () {

          URL.revokeObjectURL(url);
          reject(new Error("画像を読み込めませんでした。"));

        };

        image.src = url;

      });

    }

    /*
      OCR結果の簡易整形
    */

    function formatOCRText() {

      const textarea = document.getElementById("ocrText");

      const text = textarea.value.trim();

      if (!text) {

        setStatus(
          "ocrStatus",
          "整形するOCR結果がありません。",
          "warning"
        );

        return;
      }

      const formatted = text
        .replace(/\r/g, "")
        .replace(/[ \t]+/g, " ")
        .replace(/\n{3,}/g, "\n\n")
        .trim();

      textarea.value = formatted;

      setStatus(
        "ocrStatus",
        "OCR結果を整形しました。馬番・馬名・オッズなどを確認してください。",
        "normal"
      );

    }

    /*
      入力値取得
    */

    function getValue(id, defaultValue = "未入力") {

      const element = document.getElementById(id);

      if (!element) {
        return defaultValue;
      }

      const value = element.value.trim();

      return value || defaultValue;

    }

    /*
      プロンプト作成
    */

    function buildPrompt() {

      const raceDate = getValue("raceDate");
      const category = getValue("category");
      const track = getValue("track");
      const raceNumber = getValue("raceNumber");
      const distance = getValue("distance");
      const course = getValue("course");
      const weather = getValue("weather");
      const trackCondition = getValue("trackCondition");
      const predictionStyle = getValue("predictionStyle");
      const budget = getValue("budget");
      const additionalInfo = getValue("additionalInfo");
      const customPrompt = getValue("customPrompt");
      const ocrText = getValue("ocrText", "OCR情報なし");

      const prompt = `

あなたは中央競馬・地方競馬に対応した競馬予想分析アシスタントです。

━━━━━━━━━━━━━━━━━━
【レース情報】
━━━━━━━━━━━━━━━━━━

開催日：${raceDate}
開催区分：${category}
競馬場：${track}
レース番号：${raceNumber}R
距離：${distance}
コース・条件：${course}
天気：${weather}
馬場状態：${trackCondition}
予想スタイル：${predictionStyle}
想定購入金額：${budget}

追加情報：
${additionalInfo}

追加指示：
${customPrompt}

━━━━━━━━━━━━━━━━━━
【OCRで読み取った出馬表】
━━━━━━━━━━━━━━━━━━

${ocrText}

━━━━━━━━━━━━━━━━━━

━━━━━━━━━━━━━━━━━━

1. 開催日・競馬場・レース番号を最初に確認してください。
2. OCRの誤認識がないか確認してください。
3. 馬番・馬名・人気・単勝オッズの整合性を確認してください。
4. OCRに存在しない馬を勝手に作らないでください。
5. 確認できない情報は「未確認」と明記してください。
6. 最新情報を確認できない場合は、そのことを明記してください。
7. 推測と確認済みの情報を分けてください。

━━━━━━━━━━━━━━━━━━
【分析項目】
━━━━━━━━━━━━━━━━━━

・近走成績

情報が不足している場合は、無理に断定しないでください。

      return prompt;

    }

    /*
      プロンプト表示
    */

    function showPrompt() {

      const prompt = buildPrompt();

      document.getElementById("promptOutput").value = prompt;

      setStatus(
        "markCheck",
        "プロンプトを作成しました。内容を確認してください。",
        "normal"
      );

    }

    /*
      プロンプトコピー
    */

    async function copyPrompt() {

      const output = document.getElementById("promptOutput");

      if (!output.value.trim()) {
        showPrompt();
      }

      const text = document.getElementById("promptOutput").value;

      if (!text.trim()) {

        setStatus(
          "markCheck",
          "コピーするプロンプトがありません。",
          "warning"
        );

        return;
      }

      try {

        await navigator.clipboard.writeText(text);

        setStatus(
          "markCheck",
          "プロンプトをコピーしました。",
          "normal"
        );

      } catch (error) {

        output.focus();
        output.select();

        const copied = document.execCommand("copy");

        if (copied) {

          setStatus(
            "markCheck",
            "プロンプトをコピーしました。",
            "normal"
          );

        } else {

          setStatus(
            "markCheck",
            "自動コピーに失敗しました。選択された文章を手動でコピーしてください。",
            "warning"
          );

        }

      }

    }

    /*
      ChatGPTを開く
    */

    function openChatGPT() {

      let prompt = document.getElementById("promptOutput").value.trim();

      if (!prompt) {

        prompt = buildPrompt();

        document.getElementById("promptOutput").value = prompt;

      }

      if (!prompt) {

        setStatus(
          "markCheck",
          "プロンプトがありません。",
          "warning"
        );

        return;
      }

      const url =
        "https://chatgpt.com/?q=" +
        encodeURIComponent(prompt);

      window.open(url, "_blank");

    }

    /*
      印の頭数チェック
    */

    function checkMarkCounts() {

      const text = document.getElementById("promptOutput").value;

      if (!text.trim()) {

        setStatus(
          "markCheck",
          "先にプロンプトを作成してください。",
          "warning"
        );

        return;
      }

      const result = [];

      const rules = [
        {
          mark: "◎",
          min: 1,
          max: 1
        },
        {
          mark: "○",
          min: 1,
          max: 2
        },
        {
          mark: "▲",
          min: 1,
          max: 2
        },
        {
          mark: "△",
          min: 2,
          max: 4
        },
        {
          mark: "☆",
          min: 1,
          max: 2
        },
        {
          mark: "注",
          min: 1,
          max: 3
        }
      ];

      rules.forEach(function (rule) {

        const count =
          (text.match(new RegExp(escapeRegExp(rule.mark), "g")) || []).length;

        const valid =
          count >= rule.min &&
          count <= rule.max;

        result.push(
          `${rule.mark}：${count}個 ` +
          (valid ? "範囲内" : "要確認")
        );

      });

      document.getElementById("markCheck").textContent =
        result.join("\n");

    }

    /*
      正規表現用の文字エスケープ
    */

    function escapeRegExp(text) {

      return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

    }

  </script>
