<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競馬予想チャッピー</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f4f6;
  color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",
  "Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
}

header{
  background:#111827;
  color:white;
  padding:18px 14px;
}

header h1{
  margin:0;
  font-size:21px;
}

header p{
  margin:6px 0 0;
  color:#cbd5e1;
  font-size:12px;
}

main{
  max-width:900px;
  margin:auto;
  padding:10px;
}

.card{
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

h2{
  font-size:18px;
  margin:0 0 12px;
}

h3{
  font-size:15px;
  margin:16px 0 8px;
}

label{
  display:block;
  font-size:12px;
  color:#64748b;
  margin-bottom:4px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

select,
input,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  background:white;
  font-size:15px;
}

textarea{
  min-height:110px;
  resize:vertical;
  font-family:inherit;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.primary{
  background:#111827;
  color:white;
}

.good{
  background:#166534;
  color:white;
}

.secondary{
  background:#e2e8f0;
  color:#111827;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.status{
  margin-top:10px;
  padding:10px;
  border-radius:9px;
  background:#f1f5f9;
  font-size:13px;
  line-height:1.6;
}

.notice{
  padding:10px;
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#9a3412;
  border-radius:9px;
  font-size:12px;
  line-height:1.7;
}

.horse{
  border:1px solid #e5e7eb;
  border-radius:11px;
  padding:10px;
  margin-bottom:9px;
  background:#f8fafc;
}

.horse-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:7px;
  font-weight:700;
}

.horse-title span{
  color:#64748b;
  font-size:12px;
}

.remove{
  background:#fee2e2;
  color:#991b1b;
  padding:7px 10px;
  font-size:12px;
}

textarea.prompt{
  min-height:260px;
  font-family:monospace;
  font-size:12px;
}

.big-button{
  width:100%;
  padding:15px;
  font-size:16px;
}

.small{
  color:#64748b;
  font-size:12px;
  line-height:1.7;
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>🏇 競馬予想チャッピー</h1>
  <p>JRA・地方対応 / 最大18頭 / 自由入力方式</p>
</header>

<main>

<!-- レース条件 -->
<section class="card">

<h2>① レース条件</h2>

<div class="grid">

<div>
<label>開催区分</label>
<select id="raceType">
  <option value="中央競馬（JRA）">中央競馬（JRA）</option>
  <option value="地方競馬">地方競馬</option>
</select>
</div>

<div>
<label>競馬場</label>
<select id="track">
  <option value="">選択してください</option>

  <optgroup label="JRA">
    <option>札幌</option>
    <option>函館</option>
    <option>福島</option>
    <option>新潟</option>
    <option>東京</option>
    <option>中山</option>
    <option>中京</option>
    <option>京都</option>
    <option>阪神</option>
    <option>小倉</option>
  </optgroup>

  <optgroup label="地方">
    <option>門別</option>
    <option>盛岡</option>
    <option>水沢</option>
    <option>浦和</option>
    <option>船橋</option>
    <option>大井</option>
    <option>川崎</option>
    <option>金沢</option>
    <option>笠松</option>
    <option>名古屋</option>
    <option>園田</option>
    <option>姫路</option>
    <option>高知</option>
    <option>佐賀</option>
  </optgroup>
</select>
</div>

<div>
<label>距離</label>
<select id="distance">
  <option value="">選択してください</option>

  <option>850m</option>
  <option>860m</option>
  <option>870m</option>
  <option>880m</option>
  <option>890m</option>
  <option>900m</option>

  <option>1000m</option>
  <option>1100m</option>
  <option>1150m</option>
  <option>1200m</option>
  <option>1230m</option>
  <option>1250m</option>
  <option>1300m</option>
  <option>1400m</option>
  <option>1500m</option>
  <option>1600m</option>
  <option>1700m</option>
  <option>1800m</option>
  <option>1900m</option>
  <option>2000m</option>
  <option>2100m</option>
  <option>2200m</option>
  <option>2300m</option>
  <option>2400m</option>
  <option>2500m</option>
  <option>2600m</option>
  <option>2700m</option>
  <option>2800m</option>
  <option>3000m</option>
  <option>3200m</option>
</select>
</div>

<div>
<label>コース</label>
<select id="surface">
  <option value="">選択してください</option>
  <option>芝</option>
  <option>ダート</option>
  <option>障害</option>
</select>
</div>

<div>
<label>天気</label>
<select id="weather">
  <option value="">選択してください</option>
  <option>晴</option>
  <option>曇</option>
  <option>雨</option>
  <option>小雨</option>
  <option>雪</option>
  <option>不明</option>
</select>
</div>

<div>
<label>馬場状態</label>
<select id="going">
  <option value="">選択してください</option>
  <option>良</option>
  <option>稍重</option>
  <option>重</option>
  <option>不良</option>
  <option>不明</option>
</select>
</div>

<div>
<label>レース番号</label>
<select id="raceNumber">
  <option value="">選択してください</option>
  <option>1R</option>
  <option>2R</option>
  <option>3R</option>
  <option>4R</option>
  <option>5R</option>
  <option>6R</option>
  <option>7R</option>
  <option>8R</option>
  <option>9R</option>
  <option>10R</option>
  <option>11R</option>
  <option>12R</option>
</select>
</div>

</div>

</section>


<!-- 出走馬 -->
<section class="card">

<h2>② 出走馬メモ</h2>

<div class="notice">
馬番・馬名・騎手などの固定入力欄はありません。<br>
<strong>1頭につき自由にメモしてください。</strong><br>
例：「1 サクラ○○　逃げ　前走1着　1200得意　内枠有利」
</div>

<div id="horses"></div>

<div class="actions">
<button class="secondary" type="button" id="addHorseButton">
＋馬を追加
</button>

<button class="secondary" type="button" id="clearHorsesButton">
全消去
</button>
</div>

<div class="status" id="horseStatus">
0 / 18頭
</div>

</section>


<!-- 追加情報 -->
<section class="card">

<h2>③ その他メモ</h2>

<textarea
id="extraMemo"
placeholder="例：
展開は逃げ馬が多い
内枠有利
前残り傾向
人気馬に不安あり
穴馬を1頭入れてほしい
買い目は3連単中心
"></textarea>

</section>


<!-- ChatGPTへ -->
<section class="card">

<h2>④ チャッピーに聞く</h2>

<p class="small">
入力内容からChatGPTにそのまま渡せる予想依頼文を自動作成します。
「コピーしてChatGPTへ」を押してください。
</p>

<button
  class="primary big-button"
  type="button"
  id="askButton"
>
🤖 チャッピーに聞く
</button>

<div
  class="status"
  id="copyStatus"
>
待機中
</div>

<h3>ChatGPTに送る文章</h3>

<textarea
class="prompt"
id="promptText"
readonly
></textarea>

<div class="actions">

<button
class="good"
type="button"
id="copyButton"
>
📋 コピーしてChatGPTへ
</button>

<button
class="secondary"
type="button"
id="openChatGPTButton"
>
💬 ChatGPTを開く
</button>

</div>

</section>

</main>


<script>

"use strict";


/* =========================================================
   基本
========================================================= */

const MAX_HORSES = 18;

let horseCount = 0;

const $ = id => document.getElementById(id);


/* =========================================================
   馬欄追加
========================================================= */

function addHorse(){

  if(horseCount >= MAX_HORSES){

    alert("最大18頭までです。");

    return;
  }

  horseCount++;

  const box = document.createElement("div");

  box.className = "horse";

  box.dataset.number = horseCount;

  box.innerHTML = `

    <div class="horse-title">

      <span>
        出走馬 ${horseCount}
      </span>

      <button
        type="button"
        class="remove"
      >
        この馬を削除
      </button>

    </div>

    <textarea
      class="horseMemo"
      placeholder="この馬について自由に入力

例：
1 サンプルホース
単勝4.5倍
逃げ
前走1着
1200m得意
大井ダート良馬場得意
内枠なら買い
騎手○○
穴候補
"
    ></textarea>
  `;

  box
    .querySelector(".remove")
    .addEventListener(
      "click",
      function(){

        box.remove();

        updateHorseNumbers();

      }
    );

  $("horses").appendChild(box);

  updateHorseNumbers();

  box
    .querySelector("textarea")
    .focus();
}


/* =========================================================
   頭数更新
========================================================= */

function updateHorseNumbers(){

  const boxes =
    document.querySelectorAll(".horse");

  horseCount = boxes.length;

  boxes.forEach(
    (box,index)=>{

      box.dataset.number =
        index + 1;

      const title =
        box.querySelector(".horse-title span");

      title.textContent =
        "出走馬 " +
        (index + 1);

    }
  );

  $("horseStatus").textContent =
    horseCount +
    " / " +
    MAX_HORSES +
    "頭";

}


/* =========================================================
   全消去
========================================================= */

function clearHorses(){

  if(
    !confirm("入力した出走馬メモを全部消しますか？")
  ){

    return;
  }

  $("horses").innerHTML = "";

  horseCount = 0;

  updateHorseNumbers();

}


/* =========================================================
   レース情報取得
========================================================= */

function getRaceInfo(){

  return {

    type:
      $("raceType").value,

    track:
      $("track").value ||
      "未指定",

    distance:
      $("distance").value ||
      "未指定",

    surface:
      $("surface").value ||
      "未指定",

    weather:
      $("weather").value ||
      "未指定",

    going:
      $("going").value ||
      "未指定",

    raceNumber:
      $("raceNumber").value ||
      "未指定"

  };

}


/* =========================================================
   馬情報取得
========================================================= */

function getHorseMemos(){

  return Array
    .from(
      document.querySelectorAll(".horseMemo")
    )
    .map(
      (textarea,index)=>{

        const text =
          textarea.value.trim();

        if(!text){

          return (
            "出走馬 " +
            (index + 1) +
            "：情報なし"
          );

        }

        return (
          "【出走馬 " +
          (index + 1) +
          "】\n" +
          text
        );

      }
    );

}


/* =========================================================
   プロンプト作成
========================================================= */

function createPrompt(){

  const race =
    getRaceInfo();

  const horses =
    getHorseMemos();

  const extra =
    $("extraMemo")
      .value
      .trim();


  let prompt = `

あなたは中央競馬・地方競馬に対応した
競馬予想分析アシスタントです。

以下のレース情報と出走馬メモを分析して、
できるだけ実戦的に予想してください。

━━━━━━━━━━━━━━━━━━
【レース情報】
━━━━━━━━━━━━━━━━━━

開催区分：${race.type}
競馬場：${race.track}
レース番号：${race.raceNumber}
距離：${race.distance}
コース：${race.surface}
天気：${race.weather}
馬場状態：${race.going}

━━━━━━━━━━━━━━━━━━
【出走馬】
━━━━━━━━━━━━━━━━━━

${horses.length
  ? horses.join("\n\n")
  : "出走馬情報なし"
}

━━━━━━━━━━━━━━━━━━
【追加メモ】
━━━━━━━━━━━━━━━━━━

${extra || "なし"}

━━━━━━━━━━━━━━━━━━
【予想してほしい内容】
━━━━━━━━━━━━━━━━━━

1. 各馬を分析
2. 過去走・近走内容を重視
3. 距離適性
4. コース適性
5. 馬場適性
6. 展開・脚質
7. 騎手
8. 人気とオッズが入力されていれば人気との比較
9. 穴馬候補
10. 最終的な印

印は以下の形式で出してください。

◎
○
▲
△
△
☆

同じ印の馬が複数いる場合はまとめてください。

例：

◎ 5
○ 3
▲ 8
△ 1・6
☆ 11

最後に、

・本命
・対抗
・穴馬
・危険な人気馬
・ワイド
・馬連
・3連複
・3連単

を簡潔に出してください。

馬番がメモ内に書かれている場合は、
その馬番を正確に使用してください。

情報が不足している場合は、
不足していることを明記したうえで、
入力された情報だけでも可能な範囲で予想してください。

`;

  return prompt.trim();

}


/* =========================================================
   チャッピーに聞く
========================================================= */

function generatePrompt(){

  const prompt =
    createPrompt();

  $("promptText").value =
    prompt;

  $("copyStatus").textContent =
    "予想依頼文を作成しました。";

  $("promptText").focus();

  $("promptText").select();

}


/* =========================================================
   コピー
========================================================= */

async function copyPrompt(){

  const prompt =
    $("promptText").value.trim();

  if(!prompt){

    generatePrompt();

  }

  const text =
    $("promptText").value;

  try{

    await navigator.clipboard.writeText(
      text
    );

    $("copyStatus").textContent =
      "✅ コピーしました。ChatGPTを開いて貼り付けてください。";

    /*
     * ChatGPTアプリ / Webを開く
     */

    setTimeout(
      function(){

        window.location.href =
          "https://chatgpt.com/";

      },
      300
    );

  }catch(error){

    /*
     * iPhoneなどでClipboard APIが使えない場合
     */

    $("promptText").focus();

    $("promptText").select();

    $("copyStatus").textContent =
      "文章を選択しました。コピーしてChatGPTに貼り付けてください。";

  }

}


/* =========================================================
   ChatGPTを開く
========================================================= */

function openChatGPT(){

  window.location.href =
    "https://chatgpt.com/";

}


/* =========================================================
   ボタン
========================================================= */

$("addHorseButton")
  .addEventListener(
    "click",
    addHorse
  );


$("clearHorsesButton")
  .addEventListener(
    "click",
    clearHorses
  );


$("askButton")
  .addEventListener(
    "click",
    generatePrompt
  );


$("copyButton")
  .addEventListener(
    "click",
    copyPrompt
  );


$("openChatGPTButton")
  .addEventListener(
    "click",
    openChatGPT
  );


/* =========================================================
   最初から18頭の枠を作らない
   必要な分だけ「＋馬を追加」
========================================================= */

updateHorseNumbers();

</script>

</body>
</html>
