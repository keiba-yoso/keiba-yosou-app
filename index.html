<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>競馬予想シミュレーター</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:#f3f4f6;
  color:#111827;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}
h1{margin:0 0 6px}
h2{margin:0 0 14px;font-size:20px}
.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}
label{
  font-size:13px;
  font-weight:bold;
}
input,select{
  width:100%;
  margin-top:6px;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
  background:white;
}
button{
  border:0;
  border-radius:11px;
  padding:12px 18px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
.primary{
  background:#111827;
  color:white;
}
.secondary{
  background:#e5e7eb;
  color:#111827;
}
.danger{
  background:#fee2e2;
  color:#991b1b;
}
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}
.table-wrap{
  overflow-x:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}
th,td{
  border-bottom:1px solid #e5e7eb;
  padding:9px 6px;
  text-align:center;
  font-size:13px;
}
th{
  background:#f9fafb;
}
td:first-child,th:first-child{
  position:sticky;
  left:0;
  background:white;
}
.result-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}
.stat{
  background:#f9fafb;
  padding:15px;
  border-radius:12px;
}
.stat strong{
  display:block;
  font-size:24px;
  margin-top:5px;
}
.mark{
  font-size:20px;
  font-weight:bold;
}
◎{color:#dc2626}
○{color:#2563eb}
▲{color:#d97706}
△{color:#16a34a}
.good{
  font-weight:bold;
  color:#dc2626;
}
.bad{
  color:#6b7280;
}
.rank1{
  background:#fff7ed;
}
.small{
  font-size:12px;
  color:#6b7280;
}
#status{
  margin-top:10px;
  font-weight:bold;
}
@media(max-width:600px){
  .container{padding:12px}
  .card{padding:14px}
}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>🏇 競馬予想シミュレーター</h1>
    <div class="small">
      過去走などから作成した能力値を入力し、レースを大量シミュレーションします。
    </div>
  </div>
  <!-- レース条件 -->
  <div class="card">
    <h2>① レース条件</h2>
    <div class="grid">
      <label>
        距離
        <select id="distance">
          <option value="1200">1200m</option>
          <option value="1400">1400m</option>
          <option value="1600" selected>1600m</option>
          <option value="1800">1800m</option>
          <option value="2000">2000m</option>
          <option value="2200">2200m</option>
          <option value="2400">2400m</option>
          <option value="2500">2500m</option>
          <option value="3000">3000m</option>
        </select>
      </label>
      <label>
        馬場
        <select id="track">
          <option value="good">良</option>
          <option value="yield">稍重</option>
          <option value="heavy">重</option>
          <option value="bad">不良</option>
        </select>
      </label>
      <label>
        ペース
        <select id="pace">
          <option value="slow">スローペース</option>
          <option value="normal" selected>平均ペース</option>
          <option value="fast">ハイペース</option>
        </select>
      </label>
      <label>
        シミュレーション回数
        <select id="simCount">
          <option value="1000">1,000回</option>
          <option value="5000">5,000回</option>
          <option value="10000" selected>10,000回</option>
          <option value="30000">30,000回</option>
        </select>
      </label>
    </div>
  </div>
  <!-- 馬データ -->
  <div class="card">
    <h2>② 出走馬データ</h2>
    <div class="small">
      能力値は0〜100。近走・距離適性・コース適性・馬場適性・瞬発力・スタミナなどを入力。
    </div>
    <div class="table-wrap">
      <table id="horseTable">
        <thead>
          <tr>
            <th>馬番</th>
            <th>馬名</th>
            <th>脚質</th>
            <th>近走</th>
            <th>距離</th>
            <th>コース</th>
            <th>馬場</th>
            <th>瞬発</th>
            <th>スタミナ</th>
            <th>騎手</th>
            <th>オッズ</th>
            <th>削除</th>
          </tr>
        </thead>
        <tbody id="horseBody"></tbody>
      </table>
    </div>
    <div class="actions">
      <button
        type="button"
        class="secondary"
        id="addHorse">
        ＋ 馬を追加
      </button>
      <button
        type="button"
        class="danger"
        id="clearHorses">
        全削除
      </button>
    </div>
  </div>
  <!-- シミュレーション -->
  <div class="card">
    <h2>③ シミュレーション</h2>
    <button
      type="button"
      class="primary"
      id="runSimulation">
      🚀 10,000回シミュレーション
    </button>
    <div id="status"></div>
  </div>
  <!-- 結果 -->
  <div class="card" id="resultCard" style="display:none">
    <h2>④ シミュレーション結果</h2>
    <div class="result-grid">
      <div class="stat">
        ◎ 本命
        <strong id="honmei">-</strong>
      </div>
      <div class="stat">
        ○ 対抗
        <strong id="taikou">-</strong>
      </div>
      <div class="stat">
        ▲ 単穴
        <strong id="tanana">-</strong>
      </div>
      <div class="stat">
        △ 穴
        <strong id="ana">-</strong>
      </div>
    </div>
    <br>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>印</th>
            <th>馬番</th>
            <th>馬名</th>
            <th>1着率</th>
            <th>2着率</th>
            <th>3着内率</th>
            <th>平均着順</th>
            <th>オッズ</th>
            <th>市場確率</th>
            <th>期待値判定</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>
  <!-- 馬券 -->
  <div class="card" id="ticketCard" style="display:none">
    <h2>⑤ シミュレーションから見る買い目</h2>
    <div id="tickets"></div>
  </div>
</div>
<script>
const horseBody = document.getElementById("horseBody");
const addHorse = document.getElementById("addHorse");
const clearHorses = document.getElementById("clearHorses");
const runSimulation = document.getElementById("runSimulation");
let horseNumber = 0;
/* =========================
   馬追加
========================= */
function addHorseRow(
  name="",
  style="差し",
  recent=75,
  distance=75,
  course=75,
  ground=75,
  speed=75,
  stamina=75,
  jockey=75,
  odds=10
){
  horseNumber++;
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td>
      <input
        class="num"
        type="number"
        value="${horseNumber}"
        min="1"
        max="18">
    </td>
    <td>
      <input
        class="name"
        value="${name}"
        placeholder="馬名">
    </td>
    <td>
      <select class="style">
        <option ${style==="逃げ"?"selected":""}>逃げ</option>
        <option ${style==="先行"?"selected":""}>先行</option>
        <option ${style==="差し"?"selected":""}>差し</option>
        <option ${style==="追込"?"selected":""}>追込</option>
      </select>
    </td>
    <td><input class="recent" type="number" value="${recent}" min="0" max="100"></td>
    <td><input class="distanceFit" type="number" value="${distance}" min="0" max="100"></td>
    <td><input class="courseFit" type="number" value="${course}" min="0" max="100"></td>
    <td><input class="groundFit" type="number" value="${ground}" min="0" max="100"></td>
    <td><input class="speed" type="number" value="${speed}" min="0" max="100"></td>
    <td><input class="stamina" type="number" value="${stamina}" min="0" max="100"></td>
    <td><input class="jockey" type="number" value="${jockey}" min="0" max="100"></td>
    <td><input class="odds" type="number" value="${odds}" min="1.01" step="0.1"></td>
    <td>
      <button
        type="button"
        class="danger deleteHorse">
        ×
      </button>
    </td>
  `;
  horseBody.appendChild(tr);
}
/* =========================
   初期馬
========================= */
for(let i=0;i<8;i++){
  addHorseRow(
    "馬"+(i+1),
    i===0 ? "逃げ" :
    i===1 ? "先行" :
    i===2 ? "差し" :
    "追込",
    75 + Math.floor(Math.random()*15),
    70 + Math.floor(Math.random()*25),
    70 + Math.floor(Math.random()*25),
    70 + Math.floor(Math.random()*25),
    70 + Math.floor(Math.random()*25),
    70 + Math.floor(Math.random()*25),
    70 + Math.floor(Math.random()*25),
    4 + Math.random()*16
  );
}
/* =========================
   馬追加
========================= */
addHorse.addEventListener("click",()=>{
  if(horseBody.children.length >= 18){
    alert("最大18頭です。");
    return;
  }
  addHorseRow("新馬");
});
/* =========================
   削除
========================= */
horseBody.addEventListener("click",(e)=>{
  if(!e.target.classList.contains("deleteHorse")) return;
  e.target.closest("tr").remove();
});
/* =========================
   全削除
========================= */
clearHorses.addEventListener("click",()=>{
  if(!confirm("すべて削除しますか？")) return;
  horseBody.innerHTML="";
  horseNumber=0;
});
/* =========================
   数値
========================= */
function num(value,min=0,max=100){
  let n=parseFloat(value);
  if(!Number.isFinite(n)) n=min;
  return Math.max(min,Math.min(max,n));
}
/* =========================
   能力指数
========================= */
function getPower(h){
  const recent=num(h.querySelector(".recent").value);
  const distance=num(h.querySelector(".distanceFit").value);
  const course=num(h.querySelector(".courseFit").value);
  const ground=num(h.querySelector(".groundFit").value);
  const speed=num(h.querySelector(".speed").value);
  const stamina=num(h.querySelector(".stamina").value);
  const jockey=num(h.querySelector(".jockey").value);
  /*
    基本能力
    近走       25%
    距離適性   15%
    コース適性 10%
    馬場適性   10%
    瞬発力     15%
    スタミナ   10%
    騎手       15%
  */
  return (
    recent * .25 +
    distance * .15 +
    course * .10 +
    ground * .10 +
    speed * .15 +
    stamina * .10 +
    jockey * .15
  );
}
/* =========================
   展開補正
========================= */
function paceBonus(style,pace){
  if(pace==="fast"){
    if(style==="逃げ") return -5;
    if(style==="先行") return -2;
    if(style==="差し") return 4;
    if(style==="追込") return 6;
  }
  if(pace==="slow"){
    if(style==="逃げ") return 6;
    if(style==="先行") return 4;
    if(style==="差し") return -2;
    if(style==="追込") return -5;
  }
  return 0;
}
/* =========================
   距離補正
========================= */
function distanceBonus(style,distance){
  if(distance<=1400){
    if(style==="逃げ") return 2;
    if(style==="先行") return 1;
  }
  if(distance>=2200){
    if(style==="差し") return 1;
    if(style==="追込") return 1;
  }
  return 0;
}
/* =========================
   ランダム値
========================= */
function gaussianRandom(){
  let u=0;
  let v=0;
  while(u===0) u=Math.random();
  while(v===0) v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
/* =========================
   シミュレーション
========================= */
function simulate(){
  const rows=[...horseBody.querySelectorAll("tr")];
  if(rows.length<2){
    alert("2頭以上必要です。");
    return null;
  }
  const pace=document.getElementById("pace").value;
  const distance=parseInt(
    document.getElementById("distance").value
  );
  const count=parseInt(
    document.getElementById("simCount").value
  );
  const horses=rows.map(row=>{
    const style=row.querySelector(".style").value;
    return{
      row,
      num:row.querySelector(".num").value,
      name:
        row.querySelector(".name").value ||
        "馬"+row.querySelector(".num").value,
      style,
      odds:num(
        row.querySelector(".odds").value,
        1.01,
        999
      ),
      power:getPower(row),
      win:0,
      top3:0,
      second:0,
      third:0,
      positionTotal:0
    };
  });
  for(let i=0;i<count;i++){
    const race=horses.map(h=>{
      let score=h.power;
      score += paceBonus(h.style,pace);
      score += distanceBonus(h.style,distance);
      /*
        ランダム要素
        能力が高い馬ほど安定
        能力が低い馬ほどブレやすい
      */
      const variation =
        gaussianRandom() *
        (3 + (100-h.power)*0.055);
      score += variation;
      return{
        horse:h,
        score
      };
    });
    race.sort((a,b)=>b.score-a.score);
    race.forEach((r,index)=>{
      const h=r.horse;
      h.positionTotal += index+1;
      if(index===0) h.win++;
      if(index===1) h.second++;
      if(index===2) h.third++;
      if(index<3) h.top3++;
    });
  }
  horses.forEach(h=>{
    h.winRate=h.win/count;
    h.secondRate=h.second/count;
    h.thirdRate=h.third/count;
    h.top3Rate=h.top3/count;
    h.averagePosition=
      h.positionTotal/count;
    /*
      オッズから市場確率
      1 / オッズ
    */
    h.marketProbability=
      1/h.odds;
    /*
      簡易期待値
      勝率 × オッズ
    */
    h.expectedValue=
      h.winRate*h.odds;
  });
  horses.sort((a,b)=>{
    /*
      シミュレーション結果を中心に
      期待値も少し考慮
    */
    const aScore=
      a.winRate*.65+
      a.top3Rate*.35;
    const bScore=
      b.winRate*.65+
      b.top3Rate*.35;
    return bScore-aScore;
  });
  return horses;
}
/* =========================
   印
========================= */
function getMark(index){
  if(index===0) return "◎";
  if(index===1) return "○";
  if(index===2) return "▲";
  if(index<5) return "△";
  return "";
}
/* =========================
   結果表示
========================= */
function showResults(horses){
  const resultCard=
    document.getElementById("resultCard");
  const ticketCard=
    document.getElementById("ticketCard");
  resultCard.style.display="block";
  ticketCard.style.display="block";
  document.getElementById("honmei").textContent=
    horses[0].num+"番";
  document.getElementById("taikou").textContent=
    horses[1]?.num+"番" || "-";
  document.getElementById("tanana").textContent=
    horses[2]?.num+"番" || "-";
  document.getElementById("ana").textContent=
    horses[3]?.num+"番" || "-";
  const body=document.getElementById("resultBody");
  body.innerHTML="";
  horses.forEach((h,index)=>{
    const tr=document.createElement("tr");
    if(index===0){
      tr.className="rank1";
    }
    const mark=getMark(index);
    const market=
      h.marketProbability*100;
    const win=
      h.winRate*100;
    let valueText="";
    let valueClass="";
    if(h.expectedValue>=1){
      valueText="買い候補";
      valueClass="good";
    }else{
      valueText="妙味薄";
      valueClass="bad";
    }
    tr.innerHTML=`
      <td class="mark">${mark}</td>
      <td>${h.num}</td>
      <td>${h.name}</td>
      <td>${win.toFixed(1)}%</td>
      <td>${(h.secondRate*100).toFixed(1)}%</td>
      <td>${(h.top3Rate*100).toFixed(1)}%</td>
      <td>${h.averagePosition.toFixed(2)}</td>
      <td>${h.odds.toFixed(1)}</td>
      <td>${market.toFixed(1)}%</td>
      <td class="${valueClass}">
        ${valueText}
        <br>
        <span class="small">
          EV ${h.expectedValue.toFixed(2)}
        </span>
      </td>
    `;
    body.appendChild(tr);
  });
  createTickets(horses);
}
/* =========================
   馬券候補
========================= */
function createTickets(horses){
  const box=document.getElementById("tickets");
  const a=horses[0];
  const b=horses[1];
  const c=horses[2];
  const d=horses[3];
  box.innerHTML=`
    <div class="stat">
      <strong>馬連</strong>
      <div>
        ${a.num}-${b.num}
        <br>
        ${a.num}-${c.num}
        <br>
        ${a.num}-${d.num}
      </div>
    </div>
    <br>
    <div class="stat">
      <strong>ワイド</strong>
      <div>
        ${a.num}-${b.num}
        <br>
        ${a.num}-${c.num}
        <br>
        ${a.num}-${d.num}
      </div>
    </div>
    <br>
    <div class="stat">
      <strong>3連複</strong>
      <div>
        ${a.num}-${b.num}-${c.num}
        <br>
        ${a.num}-${b.num}-${d.num}
        <br>
        ${a.num}-${c.num}-${d.num}
      </div>
    </div>
    <br>
    <div class="small">
      ※買い目はシミュレーション順位だけから生成した参考候補です。
      実際のオッズ・馬場・直前気配などを確認して最終判断してください。
    </div>
  `;
}
/* =========================
   実行
========================= */
runSimulation.addEventListener("click",()=>{
  const status=
    document.getElementById("status");
  status.textContent=
    "シミュレーション中...";
  /*
    UIを一度更新してから実行
  */
  setTimeout(()=>{
    const result=simulate();
    if(!result){
      status.textContent="エラー";
      return;
    }
    showResults(result);
    status.textContent=
      document.getElementById("simCount").value+
      "回のシミュレーション完了。";
    document
      .getElementById("resultCard")
      .scrollIntoView({
        behavior:"smooth"
      });
  },50);
});
</script>
</body>
</html>
